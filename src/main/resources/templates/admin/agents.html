<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Communication Logs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1220px; margin: 0 auto; padding: 28px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 20px; }
        .log-summary { max-width: 420px; white-space: normal; }
        .request-id { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .86rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 760px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .table-wrap { overflow-x: auto; }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <nav class="mb-3 d-flex gap-3 flex-wrap">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/admin/properties}">Properties</a>
        <a th:href="@{/admin/import}">Import</a>
        <a th:href="@{/admin/agents}">Agent logs</a>
    </nav>

    <header class="topbar">
        <div>
            <h1 class="h3 mb-1">Agent Communication Logs</h1>
            <div class="text-secondary" th:text="|${#lists.size(logs)} entries|">0 entries</div>
        </div>
        <form th:action="@{/admin/agents}" method="get" class="d-flex gap-2 flex-wrap">
            <input class="form-control" name="requestId" th:value="${requestId}" placeholder="Request ID">
            <input class="form-control" name="limit" type="number" min="1" max="500" th:value="${limit}" style="max-width: 120px">
            <button class="btn btn-primary" type="submit">Filter</button>
            <a class="btn btn-outline-secondary" th:href="@{/admin/agents}">Clear</a>
        </form>
    </header>

    <section class="panel">
        <p class="mb-0 text-secondary" th:if="${#lists.isEmpty(logs)}">
            No ACL messages have been logged yet. Run a property search or ontology update to populate this view.
        </p>
        <div class="table-wrap" th:if="${!#lists.isEmpty(logs)}">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>Time</th>
                    <th>Request</th>
                    <th>Sender</th>
                    <th>Receiver</th>
                    <th>Performative</th>
                    <th>Summary</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-05-29 10:00:00</td>
                    <td>
                        <a class="request-id" th:href="@{/admin/agents(requestId=${log.requestId})}" th:text="${log.requestId}">request-id</a>
                    </td>
                    <td th:text="${log.sender}">sender</td>
                    <td th:text="${log.receiver}">receiver</td>
                    <td><span class="badge text-bg-light border" th:text="${log.performative}">REQUEST</span></td>
                    <td class="log-summary" th:text="${log.messageSummary}">summary</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
