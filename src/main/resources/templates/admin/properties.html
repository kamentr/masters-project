<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Properties - Admin Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1220px; margin: 0 auto; padding: 28px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 20px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    </style>
</head>
<body>
<main class="app-shell">
    <nav class="mb-4 d-flex gap-3 flex-wrap">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">Home</a>
        <a class="btn btn-sm btn-primary" th:href="@{/admin/properties}">Properties</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/import}">Import CSV</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/agents}">Agent Logs</a>
    </nav>

    <header class="topbar">
        <div>
            <h1 class="h3 mb-1">Ontology Properties</h1>
            <p class="text-secondary mb-0" th:text="|Total: ${#lists.size(properties)} active property individuals|">0 properties</p>
        </div>
        <div>
            <a class="btn btn-primary btn-sm" th:href="@{/admin/import}">Import CSV</a>
        </div>
    </header>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <section class="panel">
        <p class="mb-0 text-secondary" th:if="${#lists.isEmpty(properties)}">No ontology properties are available. Import a CSV first.</p>
        
        <div class="table-responsive" th:if="${!#lists.isEmpty(properties)}">
            <table class="table table-hover align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Type</th>
                    <th>District</th>
                    <th>Price EUR</th>
                    <th>Rooms</th>
                    <th>Available</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="property : ${properties}">
                    <td class="font-monospace text-secondary" th:text="${property.id()}">ID</td>
                    <td><strong th:text="${property.title()}">Title</strong></td>
                    <td th:text="${property.type()}">Type</td>
                    <td th:text="${property.district().csvValue()}">District</td>
                    <td class="font-weight-600" th:text="${property.priceEUR()}">Price</td>
                    <td th:text="${property.rooms()}">Rooms</td>
                    <td>
                        <span class="badge text-bg-success" th:if="${property.available()}">Yes</span>
                        <span class="badge text-bg-secondary" th:if="${!property.available()}">No</span>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/properties/{id}/edit(id=${property.id()})}">Edit</a>
                            <form th:if="${property.available()}" th:action="@{/admin/properties/{id}/unavailable(id=${property.id()})}" method="post" class="m-0">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Disable</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
