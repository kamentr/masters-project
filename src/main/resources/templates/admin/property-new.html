<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Property - Admin Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1000px; margin: 0 auto; padding: 28px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 24px; }
        .form-section-header { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; color: #606a77; border-bottom: 2px solid #dde2ea; padding-bottom: 6px; margin-bottom: 16px; margin-top: 24px; }
    </style>
</head>
<body>
<main class="app-shell">
    <nav class="mb-4 d-flex gap-3 flex-wrap">
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">Home</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/properties}">Properties</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/import}">Import CSV</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/agents}">Agent Logs</a>
    </nav>

    <header class="mb-4">
        <h1 class="h3 mb-1">Add New Property</h1>
        <p class="text-secondary mb-0">Create a new listing individual in the OWL ontology and dynamically compute its search characteristics</p>
    </header>

    <div class="panel">
        <form th:action="@{/admin/properties/new}" th:object="${propertyEditForm}" method="post">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            </div>

            <div class="form-section-header mt-0">General Specifications</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="id">Property ID (Unique)</label>
                    <input class="form-control" id="id" type="text" th:field="*{id}" placeholder="e.g. 120" required th:classappend="${#fields.hasErrors('id')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('id')}" th:errors="*{id}">Property ID error</div>
                </div>
                <div class="col-md-8">
                    <label class="form-label font-weight-600" for="title">Title</label>
                    <input class="form-control" id="title" type="text" th:field="*{title}" placeholder="e.g. Cozy 2-bedroom in Center" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="type">Property Type</label>
                    <select class="form-select" id="type" th:field="*{type}">
                        <option th:each="type : ${propertyTypes}" th:value="${type}" th:text="${type}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="district">District</label>
                    <select class="form-select" id="district" th:field="*{district}">
                        <option th:each="district : ${districts}" th:value="${district}" th:text="${district.csvValue()}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="priceEUR">Price EUR</label>
                    <input class="form-control" id="priceEUR" type="number" step="0.01" th:field="*{priceEUR}" placeholder="e.g. 150000" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="areaSqM">Area sq.m</label>
                    <input class="form-control" id="areaSqM" type="number" step="0.01" th:field="*{areaSqM}" placeholder="e.g. 85" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-weight-600" for="rooms">Rooms</label>
                    <input class="form-control" id="rooms" type="number" th:field="*{rooms}" min="1" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-weight-600" for="bedrooms">Bedrooms</label>
                    <input class="form-control" id="bedrooms" type="number" th:field="*{bedrooms}" min="0" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-weight-600" for="floor">Floor</label>
                    <input class="form-control" id="floor" type="number" th:field="*{floor}" min="0" required th:classappend="${#fields.hasErrors('floor')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}">Floor error</div>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-weight-600" for="totalFloors">Total Floors</label>
                    <input class="form-control" id="totalFloors" type="number" th:field="*{totalFloors}" min="1" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="yearBuilt">Year Built</label>
                    <input class="form-control" id="yearBuilt" type="number" th:field="*{yearBuilt}" min="1850" max="2027" placeholder="e.g. 2020" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label font-weight-600" for="constructionType">Construction Type</label>
                    <select class="form-select" id="constructionType" th:field="*{constructionType}">
                        <option th:each="construction : ${constructionTypes}" th:value="${construction}" th:text="${construction}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label font-weight-600" for="heatingType">Heating Type</label>
                    <select class="form-select" id="heatingType" th:field="*{heatingType}">
                        <option th:each="heating : ${heatingTypes}" th:value="${heating}" th:text="${heating}"></option>
                    </select>
                </div>
            </div>

            <div class="form-section-header">Location & Proximities</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label font-weight-600" for="latitude">Latitude</label>
                    <input class="form-control" id="latitude" type="number" step="0.000001" th:field="*{latitude}" placeholder="e.g. 42.14" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label font-weight-600" for="longitude">Longitude</label>
                    <input class="form-control" id="longitude" type="number" step="0.000001" th:field="*{longitude}" placeholder="e.g. 24.75" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label font-weight-600" for="distanceToSchool">Distance to School (m)</label>
                    <input class="form-control" id="distanceToSchool" type="number" th:field="*{distanceToSchool}" min="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label font-weight-600" for="distanceToKindergarten">Distance to Kindergarten (m)</label>
                    <input class="form-control" id="distanceToKindergarten" type="number" th:field="*{distanceToKindergarten}" min="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label font-weight-600" for="distanceToUniversity">Distance to University (m)</label>
                    <input class="form-control" id="distanceToUniversity" type="number" th:field="*{distanceToUniversity}" min="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label font-weight-600" for="distanceToPark">Distance to Park (m)</label>
                    <input class="form-control" id="distanceToPark" type="number" th:field="*{distanceToPark}" min="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="distanceToTransport">Distance to Transport (m)</label>
                    <input class="form-control" id="distanceToTransport" type="number" th:field="*{distanceToTransport}" min="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="distanceToHospital">Distance to Hospital (m)</label>
                    <input class="form-control" id="distanceToHospital" type="number" th:field="*{distanceToHospital}" min="0" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label font-weight-600" for="distanceToPharmacy">Distance to Pharmacy (m)</label>
                    <input class="form-control" id="distanceToPharmacy" type="number" th:field="*{distanceToPharmacy}" min="0" required>
                </div>
            </div>

            <div class="form-section-header">Features & Options</div>
            <div class="d-flex gap-4 flex-wrap mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="hasElevator" th:field="*{hasElevator}">
                    <label class="form-check-label" for="hasElevator">Elevator</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="hasParking" th:field="*{hasParking}">
                    <label class="form-check-label" for="hasParking">Parking</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="hasBalcony" th:field="*{hasBalcony}">
                    <label class="form-check-label" for="hasBalcony">Balcony</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="available" th:field="*{available}" checked>
                    <label class="form-check-label text-success font-weight-600" for="available">Available</label>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary px-4" th:href="@{/admin/properties}">Cancel</a>
                <button class="btn btn-primary px-5" type="submit">Create Property</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
