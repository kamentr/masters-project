<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${projectName}">Smart Real Estate Advisor for Plovdiv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1180px; margin: 0 auto; padding: 32px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 24px; }
        .form-label { font-weight: 600; }
        .choice-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
        .topbar h1 { font-size: 2rem; margin: 0; }
        @media (max-width: 720px) {
            .topbar { align-items: flex-start; flex-direction: column; }
            .topbar h1 { font-size: 1.55rem; }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <h1 th:text="${projectName}">Smart Real Estate Advisor for Plovdiv</h1>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/properties}">Admin</a>
    </header>

    <section class="panel">
        <form th:action="@{/search}" th:object="${searchForm}" method="post">
            <div class="row g-4">
                <div class="col-md-4">
                    <label class="form-label" for="profile">Buyer profile</label>
                    <select class="form-select" id="profile" th:field="*{profile}">
                        <option th:each="profile : ${profiles}" th:value="${profile.name()}" th:text="${profile.displayName()}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="maxBudgetEUR">Max budget EUR</label>
                    <input class="form-control" id="maxBudgetEUR" type="number" min="0" step="1000" th:field="*{maxBudgetEUR}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="minRooms">Min rooms</label>
                    <input class="form-control" id="minRooms" type="number" min="0" max="10" th:field="*{minRooms}">
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="minBedrooms">Min bedrooms</label>
                    <input class="form-control" id="minBedrooms" type="number" min="0" max="8" th:field="*{minBedrooms}">
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="districts">Districts</label>
                    <select class="form-select" id="districts" th:field="*{districts}" multiple size="6">
                        <option th:each="district : ${districts}" th:value="${district.name()}" th:text="${district.csvValue()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="constructionType">Construction</label>
                    <select class="form-select" id="constructionType" th:field="*{constructionType}">
                        <option value="">Any</option>
                        <option th:each="type : ${constructionTypes}" th:value="${type.name()}" th:text="${#strings.replace(type.name(), '_', ' ')}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="heatingType">Heating</label>
                    <select class="form-select" id="heatingType" th:field="*{heatingType}">
                        <option value="">Any</option>
                        <option th:each="type : ${heatingTypes}" th:value="${type.name()}" th:text="${#strings.replace(type.name(), '_', ' ')}"></option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label d-block">Required features</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="requiresElevator" th:field="*{requiresElevator}">
                        <label class="form-check-label" for="requiresElevator">Elevator</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="requiresParking" th:field="*{requiresParking}">
                        <label class="form-check-label" for="requiresParking">Parking</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="requiresBalcony" th:field="*{requiresBalcony}">
                        <label class="form-check-label" for="requiresBalcony">Balcony</label>
                    </div>
                </div>
                <div class="col-md-8">
                    <label class="form-label d-block">Lifestyle priorities</label>
                    <div class="choice-grid">
                        <div class="form-check" th:each="priority : ${priorities}">
                            <input class="form-check-input" type="checkbox" th:id="${'priority-' + priority}" th:value="${priority}" th:field="*{priorities}">
                            <label class="form-check-label" th:for="${'priority-' + priority}" th:text="${priority}">Priority</label>
                        </div>
                    </div>
                </div>

                <div class="col-12 d-flex justify-content-end">
                    <button class="btn btn-primary px-4" type="submit">Search</button>
                </div>
            </div>
        </form>
    </section>
</main>
</body>
</html>
