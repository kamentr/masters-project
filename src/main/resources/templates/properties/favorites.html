<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Favorites - Smart Real Estate Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1200px; margin: 0 auto; padding: 28px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 24px; }
        .favorite-card { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 20px; transition: transform 0.2s, box-shadow 0.2s; }
        .favorite-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(32, 36, 44, 0.08); }
        .facts { display: flex; gap: 12px; flex-wrap: wrap; color: #606a77; font-size: 0.9rem; margin-top: 10px; }
        .price-badge { background: #e8f5e9; color: #2e7d32; font-weight: 700; padding: 4px 10px; border-radius: 4px; font-size: 0.95rem; }
    </style>
</head>
<body>
<main class="app-shell">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Saved Favorites</h1>
            <p class="text-secondary mb-0" th:text="|You have ${#lists.size(properties)} saved listings|">Favorites count</p>
        </div>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/}">Back to Search</a>
        </div>
    </header>

    <div class="panel" th:if="${#lists.isEmpty(properties)}">
        <h2 class="h5">No saved favorites yet</h2>
        <p class="text-secondary mb-3">Browse properties in search results or view their details, and click the Save/Heart icon to add them here.</p>
        <a class="btn btn-primary" th:href="@{/}">Start Searching</a>
    </div>

    <div class="row g-4" th:if="${!#lists.isEmpty(properties)}">
        <div class="col-md-6" th:each="property : ${properties}">
            <article class="favorite-card">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <h2 class="h5 mb-1"><a th:href="@{/properties/{id}(id=${property.id})}" th:text="${property.title}" class="text-decoration-none text-dark">Property Title</a></h2>
                        <p class="text-secondary small mb-0" th:text="${property.district.csvValue()}">District</p>
                    </div>
                    <span class="price-badge" th:text="|${property.priceEUR} EUR|">0 EUR</span>
                </div>
                <div class="facts">
                    <span th:text="|${property.rooms} rooms|">Rooms</span>
                    <span th:text="|${property.bedrooms} bedrooms|">Bedrooms</span>
                    <span th:text="|${property.areaSqM} sq m|">Area</span>
                    <span th:text="|Floor ${property.floor}/${property.totalFloors}|">Floor</span>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <a class="btn btn-sm btn-primary px-3" th:href="@{/properties/{id}(id=${property.id})}">Details</a>
                    <form th:action="@{/properties/{id}/favorite(id=${property.id})}" method="post" class="d-inline">
                        <input type="hidden" name="redirectUrl" value="/favorites">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                    </form>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
