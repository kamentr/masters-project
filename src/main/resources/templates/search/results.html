<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recommendations - Smart Real Estate Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { background: #f6f7fb; color: #20242c; }
        .app-shell { max-width: 1240px; margin: 0 auto; padding: 28px 18px 56px; }
        .panel { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 20px; }
        .result-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); }
        .property-card { background: #fff; border: 1px solid #dde2ea; border-radius: 8px; padding: 18px; }
        .score { min-width: 58px; min-height: 58px; display: grid; place-items: center; border-radius: 50%; background: #126a5a; color: #fff; font-weight: 700; }
        #map { width: 100%; min-height: 520px; border-radius: 8px; border: 1px solid #cfd6df; }
        .facts { display: flex; gap: 12px; flex-wrap: wrap; color: #49515d; font-size: .95rem; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 900px) {
            .result-grid { grid-template-columns: 1fr; }
            #map { min-height: 360px; }
        }
    </style>
</head>
<body>
<main class="app-shell">
    <form th:action="@{/compare}" method="get">
        <header class="topbar">
            <div>
                <h1 class="h3 mb-1">Recommendations</h1>
                <div class="text-secondary" th:text="|${#lists.size(recommendations)} matching properties|">0 matching properties</div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success" th:if="${!#lists.isEmpty(recommendations)}">Compare Selected</button>
                <a class="btn btn-outline-secondary" th:href="@{/}">New search</a>
            </div>
        </header>

        <div class="alert alert-danger" th:if="${searchError}" th:text="${searchError}"></div>

        <section class="result-grid" th:if="${!#lists.isEmpty(recommendations)}">
            <div class="d-grid gap-3">
                <article class="property-card" th:each="item : ${recommendations}">
                    <div class="d-flex gap-3 justify-content-between align-items-start">
                        <div>
                            <h2 class="h5 mb-1" th:text="${item.property.title}">Property title</h2>
                            <div class="facts">
                                <span th:text="${item.property.district.csvValue()}">District</span>
                                <span th:text="|${item.property.rooms} rooms|">Rooms</span>
                                <span th:text="|${item.property.bedrooms} bedrooms|">Bedrooms</span>
                                <span th:text="|${item.property.areaSqM} sq m|">Area</span>
                                <span th:text="|${item.property.priceEUR} EUR|">Price</span>
                            </div>
                        </div>
                        <div class="score" th:text="${item.score}">92</div>
                    </div>
                    <div class="mt-3 d-flex align-items-center justify-content-between">
                        <div>
                            <span class="badge text-bg-success" th:text="${item.confidence}">HIGH</span>
                            <span class="badge text-bg-light border" th:text="|${item.property.pricePerSqM} EUR/sq m|">EUR/sq m</span>
                        </div>
                        <div class="form-check form-switch mb-0">
                            <input class="form-check-input" type="checkbox" name="ids" th:id="|compare-${item.property.id}|" th:value="${item.property.id}">
                            <label class="form-check-label small text-secondary" th:for="|compare-${item.property.id}|">Compare</label>
                        </div>
                    </div>
                    <ul class="mt-3 mb-3">
                        <li th:each="explanation : ${item.explanations}" th:text="${explanation}">Explanation</li>
                    </ul>
                    <div class="d-flex gap-2">
                        <a class="btn btn-sm btn-primary" th:href="@{/properties/{id}(id=${item.property.id})}">Details</a>
                        <button th:formaction="@{/properties/{id}/favorite(id=${item.property.id})}" th:formmethod="post" class="btn btn-sm btn-outline-danger" type="submit">❤ Save</button>
                    </div>
                </article>
            </div>
            <aside class="panel">
                <div id="map"></div>
            </aside>
        </section>
    </form>

    <section class="panel" th:if="${#lists.isEmpty(recommendations)}">
        <h2 class="h5">No recommendations found</h2>
        <p class="mb-0 text-secondary">Try a higher budget, fewer required features, or broader district selection.</p>
    </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    const markers = /*[[${mapMarkers}]]*/ [];
    if (markers.length > 0) {
        const map = L.map('map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        const bounds = [];
        markers.forEach(marker => {
            const lat = Number(marker.latitude);
            const lng = Number(marker.longitude);
            bounds.push([lat, lng]);
            L.marker([lat, lng])
                .addTo(map)
                .bindPopup(`<strong>${marker.title}</strong><br>${marker.district}<br>Score ${marker.score}`);
        });
        map.fitBounds(bounds, { padding: [28, 28] });
    }
</script>
</body>
</html>
